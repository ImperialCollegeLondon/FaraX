[project]
name = "farax"
dynamic = ["version"]
description = "A data management platform for systhesisability in data-driven materials discovery."
authors = [
    {name = "Christopher Cave-Ayland", email = "c.cave-ayland@imperial.ac.uk"},
    {name = "Imperial College London RSE Team", email = "ict-rse-team@imperial.ac.uk"},
]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.14"

dependencies = ["django>=6.1.3"]

[tool.mypy]
disallow_any_explicit = true
disallow_any_generics = true
warn_unreachable = true
warn_unused_ignores = true
disallow_untyped_defs = true
exclude = [".venv/", "docs/"]
plugins = ["mypy_django_plugin.main"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.django-stubs]
django_settings_module = "farax.settings"

[tool.pytest.ini_options]
addopts = "-v -p no:warnings --cov=farax --cov=main --cov-branch --cov-report=html --cov-report=xml --doctest-modules --ignore=docs/"
DJANGO_SETTINGS_MODULE = "farax.settings"

[tool.coverage.run]
omit = ["*/migrations/*"]

[tool.ruff]
target-version = "py314"
extend-exclude = ["*/migrations/*"]
force-exclude = true

[tool.ruff.lint]
select = [
    "D",   # pydocstyle
    "E",   # pycodestyle
    "F",   # Pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "RUF", # ruff
]
pydocstyle.convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "D100", # Missing docstring in public module
    "D104", # Missing docstring in public package
]
[build-system]
requires = ["setuptools>=78", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "django-stubs>=6.1.2",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "pytest-mock>=3.17.0",
    "ruff>=0.17.3",
]
doc = [
    "mkdocs<2",
    "mkdocs-gen-files>=0.6.1",
    "mkdocs-literate-nav>=0.6.3",
    "mkdocs-material>=9.8.0",
    "mkdocs-section-index>=0.3.12",
    "mkdocstrings>=1.0.8",
    "mkdocstrings-python>=2.0.10",
]

[tool.setuptools]
packages = ["farax", "main", "main.migrations"]

[tool.setuptools_scm]
