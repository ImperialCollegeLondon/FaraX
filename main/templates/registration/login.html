<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Sign in - FaraX</title>
  </head>
  <body>
    {% if user.is_authenticated %}
      <h1>Signed in</h1>
      <p>You are signed in as {{ user.get_username }}.</p>
      <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit">Sign out</button>
      </form>
    {% else %}
      <h1>Sign in</h1>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit">Sign in</button>
      </form>
    {% endif %}
  </body>
</html>
