<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{% endblock %} - FaraX</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #f2f5f8;
        color: #172d40;
        font-family: system-ui, sans-serif;
        line-height: 1.5;
      }
      .banner {
        background: #123b54;
        color: #fff;
        padding: 1.2rem max(1.5rem, calc((100% - 68rem) / 2));
      }
      .brand { font-size: 1.4rem; font-weight: 700; letter-spacing: 0.02em; }
      .banner p { color: #d3e6ee; margin: 0.1rem 0 0; font-size: 0.9rem; }
      main { max-width: 31rem; margin: 4rem auto; padding: 0 1.25rem; }
      .card {
        background: #fff;
        border: 1px solid #dce5eb;
        border-radius: 0.75rem;
        box-shadow: 0 12px 30px rgb(18 59 84 / 8%);
        padding: 2rem;
      }
      h1 { font-size: 1.65rem; line-height: 1.2; margin: 0 0 0.5rem; }
      .intro { color: #536978; margin: 0 0 1.75rem; }
      form p { margin: 0 0 1.25rem; }
      label { display: block; font-weight: 600; margin-bottom: 0.4rem; }
      input:not([type="hidden"]) {
        width: 100%;
        border: 1px solid #aebfca;
        border-radius: 0.35rem;
        font: inherit;
        padding: 0.65rem 0.75rem;
      }
      input:focus-visible, button:focus-visible, a:focus-visible {
        outline: 3px solid #1a7d91;
        outline-offset: 2px;
      }
      button {
        background: #126679;
        border: 0;
        border-radius: 0.35rem;
        color: #fff;
        cursor: pointer;
        font: inherit;
        font-weight: 600;
        padding: 0.7rem 1.2rem;
      }
      button:hover { background: #0c4e5e; }
      a { color: #126679; }
      .errorlist { color: #a4262c; padding-left: 1.25rem; }
      .helptext { color: #536978; font-size: 0.9rem; }
      @media (max-width: 35rem) {
        main { margin: 2rem auto; }
        .card { padding: 1.5rem; }
      }
    </style>
  </head>
  <body>
    <header class="banner">
      <div class="brand">FaraX</div>
      <p>Data management for materials discovery</p>
    </header>
    <main>
      <section class="card" aria-labelledby="page-title">
        {% block content %}{% endblock %}
      </section>
    </main>
  </body>
</html>
