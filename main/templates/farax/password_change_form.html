{% extends "farax/account_base.html" %}

{% block title %}Change password{% endblock %}

{% block content %}
  <h1 id="page-title">Change password</h1>
  <p class="intro">Enter your current password and choose a new one.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Change password</button>
  </form>
  <p><a href="{% url 'login' %}">Back to account</a></p>
{% endblock %}
