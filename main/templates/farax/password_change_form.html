<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Change password - FaraX</title>
  </head>
  <body>
    <h1>Change password</h1>

      {% csrf_token %}
      {{ form.as_p }}

    <p><a href="{% url 'login' %}">Back to account</a></p>
  </body>
</html>
